name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: backend (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy .
      - run: uv run pytest

  frontend:
    name: frontend (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  compose:
    name: docker compose smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose up --build -d
      - name: Wait for health
        run: |
          for i in $(seq 1 30); do
            if curl -fs http://localhost:8000/api/0/health/; then exit 0; fi
            sleep 2
          done
          docker compose logs
          exit 1
      - name: End-to-end ingest + grouping check (Redis, Celery, Postgres)
        run: |
          docker compose run --rm --no-deps -v "$PWD/loadtest:/lt" web \
            python /lt/send_events.py --dsn http://79a635b512d79894d720b95fbdad5008@web:8000/3 \
            --events 300 --bugs 7 --concurrency 8 --verify --json /lt/results/ci.json
          python3 -c "import json,sys; r=json.load(open('loadtest/results/ci.json')); p=r['processing']; assert r['status_codes']=={'200':300}, r; assert p['events_processed']>=300 and p['issues_in_project']==7, r; print('ok', p)"
      - if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down -v
