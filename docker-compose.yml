# Core stack. Runs on Linux, Windows, and macOS (amd64 + arm64 images only).
#   docker compose up --build
# Vite apps (frontend/, demo/buggy-shop/) run natively with Node; Ollama runs natively.
# Later stories add profiles: `full` (Kafka + ClickHouse) and `ai` (containerised Ollama).

x-backend: &backend
  build: ./backend
  env_file:
    - path: .env
      required: false
  environment:
    DATABASE_URL: postgres://faultkeeper:faultkeeper@postgres:5432/faultkeeper
    REDIS_URL: redis://redis:6379/0
    OLLAMA_URL: http://host.docker.internal:11434
  extra_hosts:
    - "host.docker.internal:host-gateway" # Linux; built in on Docker Desktop
  volumes:
    - ./backend:/app
    - /app/.venv # hide the host's virtualenv from the container
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: faultkeeper
      POSTGRES_PASSWORD: faultkeeper
      POSTGRES_DB: faultkeeper
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U faultkeeper"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  web:
    <<: *backend
    command: ["sh", "-c", "python manage.py migrate --noinput && python manage.py seed_demo && exec uvicorn faultkeeper.asgi:application --host 0.0.0.0 --port 8000 --reload --reload-dir /app"]
    environment:
      DATABASE_URL: postgres://faultkeeper:faultkeeper@postgres:5432/faultkeeper
      REDIS_URL: redis://redis:6379/0
      OLLAMA_URL: http://host.docker.internal:11434
      WATCHFILES_FORCE_POLLING: "true" # file events don't cross Windows bind mounts
    ports:
      - "8000:8000"

  worker:
    <<: *backend
    command: celery -A faultkeeper worker --beat --schedule /tmp/celerybeat-schedule --loglevel=info --concurrency=${CELERY_CONCURRENCY:-4}

  buggy-shop-api:
    build: ./demo/buggy-shop-api
    environment:
      # Inside the compose network the API reaches Faultkeeper as `web`.
      FAULTKEEPER_DSN: http://67043222324838d283f263d0f092cc06@web:8000/2
    ports:
      - "5175:5175"
    depends_on:
      - web

  # Optional: containerised Ollama for Linux/NVIDIA hosts or quick testing.
  # On macOS/Windows prefer the native Ollama app (GPU acceleration).
  #   docker compose --profile ai up -d && docker compose exec ollama ollama pull qwen2.5-coder:3b
  ollama:
    image: ollama/ollama:latest
    profiles: ["ai"]
    ports:
      - "11434:11434"
    volumes:
      - ollama-models:/root/.ollama

volumes:
  postgres-data:
  ollama-models:
